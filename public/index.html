<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Manager</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Travel Manager</h1>
      <p class="subtitle">Manage destinations and travel packages</p>

      <section class="panel">
        <div class="panel-header">
          <h2>Destinations</h2>
          <button id="refreshDestinations" type="button">Refresh</button>
        </div>
        <div class="destination-actions">
          <button id="openDestinationModal" type="button">Add Destination</button>
        </div>
        <div class="filter-row">
          <input id="destinationFilter" placeholder="Filter by destination name" />
          <button id="applyDestinationFilter" type="button">Search</button>
        </div>
        <table id="destinationsDataTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Country</th>
              <th>Description</th>
              <th class="actions-header">Actions</th>
            </tr>
          </thead>
          <tbody id="destinationsTable"></tbody>
        </table>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Packages</h2>
          <button id="refreshPackages" type="button">Refresh</button>
        </div>
        <div class="package-actions">
          <button id="openPackageModal" type="button">Add Package</button>
        </div>
        <table id="packagesDataTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Destination ID</th>
              <th>Price (USD)</th>
              <th>Number of Days</th>
              <th class="actions-header">Actions</th>
            </tr>
          </thead>
          <tbody id="packagesTable"></tbody>
        </table>
      </section>

      <p id="message" class="message"></p>
    </main>

    <div id="destinationModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="destinationModalTitle">
      <div class="modal-content">
        <div class="panel-header modal-header">
          <h3 id="destinationModalTitle">Add Destination</h3>
        </div>
        <form id="destinationModalForm" class="form-grid destination-modal-form">
          <input type="hidden" id="destinationId" />
          <input id="destinationName" placeholder="Name" required />
          <input id="destinationCountry" placeholder="Country" required />
          <input id="destinationDescription" placeholder="Description" required size="50" />
          <button id="destinationModalSubmit" type="submit">Save Destination</button>
          <button id="destinationModalCancel" type="button" class="secondary">Cancel</button>
        </form>
      </div>
    </div>

    <div id="packageModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="packageModalTitle">
      <div class="modal-content">
        <div class="panel-header modal-header">
          <h3 id="packageModalTitle">Add Package</h3>
        </div>
        <form id="packageModalForm" class="form-grid package-modal-form">
          <input type="hidden" id="packageId" />
          <input id="packageTitle" placeholder="Title" required />
          <input id="packageDestinationId" type="number" placeholder="Destination ID" required />
          <input id="packagePrice" type="number" placeholder="Price" required />
          <input id="packageDuration" type="number" placeholder="Duration" required />
          <button id="packageModalSubmit" type="submit">Save Package</button>
          <button id="packageModalCancel" type="button" class="secondary">Cancel</button>
        </form>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
